name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Set up Java for Firestore rules tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Install Functions dependencies
        run: npm --prefix functions ci
      - name: Test application
        run: npm test
      - name: Test Functions
        run: npm run test:functions
      - name: Test Auth, Firestore, Functions, and security rules together
        run: npm run test:emulators
      - name: Lint application
        run: npm run lint
      - name: Build site
        run: npm run build
